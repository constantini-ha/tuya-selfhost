send_learned_ir_command:
  target:
    entity:
      domain: remote
      integration: tuya_selfhost
  fields:
    command:
      required: true
      example: "Play"
      selector:
        object:
    device:
      example: "TV"
      selector:
        text:
    emitter_entity_id:
      example: "infrared.my_ir_emitter"
      required: true
      selector:
        entity:
          filter:
            domain: infrared

network_report:
  fields:
    check_cloud:
      default: false
      selector:
        boolean:

alexa_config:
  fields: {}

alexa_announce:
  fields:
    forget:
      example: "button.tuya_remote_ar_condicionado_frio_22"
      selector:
        text:
          multiple: true
